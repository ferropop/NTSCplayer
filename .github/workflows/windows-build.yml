name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NTSC-Player-Windows-Port-Source-v4.zip'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Expand Windows source
        shell: pwsh
        run: |
          Expand-Archive NTSC-Player-Windows-Port-Source-v4.zip source
          $project = Get-ChildItem source -Recurse -Filter Cargo.toml |
            Where-Object { $_.FullName -match 'NtscPlayerWindows[\\/]Cargo.toml$' } |
            Select-Object -First 1
          if (-not $project) { throw "Could not locate the Windows Cargo project." }
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

          # Compatibility correction discovered by the first Windows compiler pass.
          $shader = Join-Path $project.Directory.FullName "src\shader.rs"
          $source = Get-Content $shader -Raw
          $source = $source.Replace(
            'let mapped = images.readback.slice(..).get_mapped_range();',
            'let mapped = images.readback.slice(..).get_mapped_range().map_err(|e| format!("Shader readback view failed: {e}"))?;'
          )
          Set-Content $shader $source

