name: Build Windows x64

# Triggered for a fresh portable build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NTSC-Player-Windows-Port-Source-v13.zip'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Expand player source
        shell: pwsh
        run: |
          Expand-Archive NTSC-Player-Windows-Port-Source-v13.zip source
          $project = Get-ChildItem source -Recurse -Filter Cargo.toml |
            Where-Object { $_.FullName -match 'NtscPlayerWindows[\\/]Cargo.toml$' } |
            Select-Object -First 1
          if (-not $project) { throw "Could not locate the Windows Cargo project." }
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.PROJECT_DIR }}'

      - name: Check Windows source
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          cargo check --target x86_64-pc-windows-msvc

      - name: Test Windows source
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          cargo test --target x86_64-pc-windows-msvc

      - name: Download current x64 libmpv runtime
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Headers @{ "User-Agent" = "NTSC-Player-Windows-Build" } `
            -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-[0-9].*\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw "The current mpv release has no standard x64 development archive." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-runtime.7z
          New-Item -ItemType Directory -Force mpv-runtime | Out-Null
          7z x mpv-runtime.7z -ompv-runtime -y
          $dll = Get-ChildItem mpv-runtime -Recurse -File |
            Where-Object { $_.Name -in @('mpv-2.dll', 'libmpv-2.dll') } |
            Select-Object -First 1
          if (-not $dll) { throw "The libmpv archive did not contain a compatible DLL." }
          "LIBMPV_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Build portable Windows player
        shell: pwsh
        run: |
          & "$env:PROJECT_DIR\build-windows.ps1" -MpvDll $env:LIBMPV_DLL

      - name: Prepare executable-only update
        shell: pwsh
        run: |
          $exe = Join-Path $env:PROJECT_DIR 'dist\NTSC Player Windows\NTSC Player.exe'
          $exeDir = Join-Path $env:PROJECT_DIR 'dist\EXE Only'
          New-Item -ItemType Directory -Force $exeDir | Out-Null
          Copy-Item $exe (Join-Path $exeDir 'NTSC Player.exe') -Force

      - name: Upload complete portable build
        uses: actions/upload-artifact@v4
        with:
          name: NTSC-Player-Windows-x64
          path: '${{ env.PROJECT_DIR }}\dist\NTSC-Player-Windows-x64.zip'
          if-no-files-found: error
          retention-days: 30

      - name: Upload executable-only update
        uses: actions/upload-artifact@v4
        with:
          name: NTSC-Player-Windows-EXE-Only
          path: '${{ env.PROJECT_DIR }}\dist\EXE Only\NTSC Player.exe'
          if-no-files-found: error
          retention-days: 30
