name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NTSC-Player-Windows-Port-Source-v4.zip'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Expand Windows source
        shell: pwsh
        run: |
          Expand-Archive NTSC-Player-Windows-Port-Source-v4.zip source
          $project = Get-ChildItem source -Recurse -Filter Cargo.toml |
            Where-Object { $_.FullName -match 'NtscPlayerWindows[\\/]Cargo.toml$' } |
            Select-Object -First 1
          if (-not $project) { throw "Could not locate the Windows Cargo project." }
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

          # Compatibility correction discovered by the first Windows compiler pass.
          $shader = Join-Path $project.Directory.FullName "src\shader.rs"
          $source = Get-Content $shader -Raw
          $source = $source.Replace(
            'let mapped = images.readback.slice(..).get_mapped_range();',
            'let mapped = images.readback.slice(..).get_mapped_range().map_err(|e| format!("Shader readback view failed: {e}"))?;'
          )
          Set-Content $shader $source

          # Apply player fixes without replacing the already-uploaded source archive.
          $patchBase64 = @(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          ) -join ''
          [IO.File]::WriteAllBytes("windows-fixes.patch", [Convert]::FromBase64String($patchBase64))
          git apply --directory=source --whitespace=nowarn windows-fixes.patch

      - name: Check Windows build
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo check

      - name: Build release
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo build --release

      - name: Download official RetroArch shaders
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/libretro/slang-shaders.git "$env:PROJECT_DIR\vendor\slang-shaders"
          Remove-Item "$env:PROJECT_DIR\vendor\slang-shaders\.git" -Recurse -Force

      - name: Download libmpv
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest
          $asset = $release.assets |
            Where-Object { $_.name -match 'mpv-dev-x86_64.*\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw "Could not find the current x64 libmpv development archive." }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv | Out-Null
          $dll = Get-ChildItem mpv -Recurse -Filter mpv-2.dll | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem mpv -Recurse -Filter libmpv-2.dll | Select-Object -First 1 }
          if (-not $dll) { throw "libmpv DLL was not found." }
          "MPV_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Package portable app
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist\NTSC Player Windows"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$env:PROJECT_DIR\target\release\ntsc-player-windows.exe" "$dist\NTSC Player.exe"
          Copy-Item "$env:MPV_DLL" "$dist\mpv-2.dll"
          Copy-Item "$env:PROJECT_DIR\README.md" "$dist\README.txt"
          Copy-Item "$env:PROJECT_DIR\vendor\slang-shaders" "$dist\slang-shaders" -Recurse
          Compress-Archive -Path "$dist\*" -DestinationPath NTSC-Player-Windows-x64.zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: NTSC-Player-Windows-x64
          path: NTSC-Player-Windows-x64.zip


